<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">CLOTHO — wardrobe intelligence, made visible</title>
  <desc id="desc">A light editorial banner using the real CLOTHO logo and a cropped capture of the live app interface.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="0.58" stop-color="#fcfbf8"/>
      <stop offset="1" stop-color="#f3ece7"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#972d3f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#972d3f" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="appCrop"><rect x="886" y="75" width="622" height="348" rx="5"/></clipPath>
    <filter id="sheetShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#3d1b22" flood-opacity=".14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#3d1b22" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="24" fill="url(#paper)"/>
  <path d="M42 82H1558M42 423H1558" stroke="#171715" stroke-opacity=".13"/>
  <path d="M830 82V423" stroke="#171715" stroke-opacity=".10"/>
  <path d="M862 82V423" stroke="#972d3f" stroke-opacity=".17"/>

  <!-- The real wordmark asset sits alone in a reserved area; no drawn garment competes with it. -->
  <image href="../../public/branding/clotho-logo.png" x="86" y="88" width="495" height="75" preserveAspectRatio="xMinYMid meet"/>
  <text x="90" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4" fill="#972d3f">CLASSY LOOKS FOR WHAT IS ACTUALLY HAPPENING</text>
  <text x="88" y="255" font-family="Iowan Old Style, Baskerville, Georgia, 'Times New Roman', serif" font-size="49" fill="#171715">The wardrobe is yours.</text>
  <text x="88" y="310" font-family="Iowan Old Style, Baskerville, Georgia, 'Times New Roman', serif" font-size="49" fill="#171715">The decision is shared.</text>
  <rect x="88" y="348" width="440" height="39" fill="url(#wash)"/>
  <text x="103" y="373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.4" fill="#7a1f3d">AGENT PROPOSES  ·  YOU DECIDE</text>
  <path d="M88 416C176 384 237 453 328 421S455 400 540 421" fill="none" stroke="#972d3f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="540" cy="421" r="4" fill="#972d3f"/>

  <!-- Real deployed UI capture, treated like an editorial product photograph. -->
  <g filter="url(#sheetShadow)">
    <rect x="886" y="75" width="622" height="348" rx="5" fill="#fff" stroke="#171715" stroke-opacity=".18"/>
    <rect x="886" y="75" width="622" height="27" rx="5" fill="#f1e7e3"/>
    <circle cx="908" cy="89" r="3" fill="#972d3f"/><circle cx="920" cy="89" r="3" fill="#c58b76"/><circle cx="932" cy="89" r="3" fill="#171715" opacity=".3"/>
    <text x="957" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2" fill="#7a7771">CLOTHO / LIVE PRODUCT</text>
    <g clip-path="url(#appCrop)">
      <image href="../../public/screenshot.jpeg" x="886" y="102" width="622" height="350" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <rect x="886" y="75" width="622" height="348" rx="5" fill="none" stroke="#171715" stroke-opacity=".18"/>
  </g>

  <g transform="translate(1152 439)" filter="url(#softShadow)">
    <rect width="356" height="34" rx="17" fill="#972d3f"/>
    <text x="18" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#fffefa">WEBMCP · VISIBLE · REVIEWABLE</text>
  </g>
  <text x="888" y="463" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#7a7771">TODAY'S LOOK  /  CALENDAR  /  WEEK PLAN  /  RECOLOR</text>
</svg>
