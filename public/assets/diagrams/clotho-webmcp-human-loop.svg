<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CLOTHO WebMCP human loop</title><desc id="desc">A cinematic process map from person request through agent tool call, visible proposal, human choice, explicit write, and local calendar state.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f4ece8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#171715" flood-opacity=".12"/></filter><style>.ink{fill:#171715;font-family:Verdana}.muted{fill:#6d6870;font-family:Verdana}.head{font-size:28px;font-weight:800;letter-spacing:.8px}.zone{font-size:15px;font-weight:800;letter-spacing:1.5px}.label{font-size:17px;font-weight:800}.small{font-size:13px}.dash{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 10;animation:march 1.15s linear infinite}.solid{fill:none;stroke-linecap:round;stroke-width:3}.arrow{marker-end:url(#arrow)}@keyframes march{to{stroke-dashoffset:-48}}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7a1f3d"/></marker></defs>
<rect width="1600" height="900" rx="28" fill="url(#bg)"/><path d="M40 108H1560" stroke="#eaded9"/><g transform="translate(48 28)"><path d="M22 0C-2 14-8 41 6 63c13 20 37 28 60 20 20-7 30-24 26-40-4-15-18-23-31-16-11 6-16 18-10 28 6 10 17 13 26 8" fill="none" stroke="#7a1f3d" stroke-width="7" stroke-linecap="round"/><path d="M25 17c15 8 25 20 29 37" fill="none" stroke="#c89b3c" stroke-width="4" stroke-linecap="round"/></g><text x="135" y="60" class="ink head">CLOTHO / WEBMCP HUMAN LOOP</text><text x="137" y="88" class="muted small">The agent coordinates the work. The person owns the decision.</text><rect x="1250" y="30" width="300" height="54" rx="14" fill="#fff8df" stroke="#c89b3c" stroke-width="2"/><text x="1400" y="53" text-anchor="middle" class="ink small" font-weight="800">WRITE BOUNDARY</text><text x="1400" y="71" text-anchor="middle" class="muted small">approval is visible, never implied</text>
<g filter="url(#shadow)"><rect x="40" y="150" width="280" height="58" rx="12" fill="#f1dfe3" stroke="#7a1f3d" stroke-width="2"/><rect x="380" y="150" width="280" height="58" rx="12" fill="#fff8df" stroke="#c89b3c" stroke-width="2"/><rect x="720" y="150" width="280" height="58" rx="12" fill="#e8edf5" stroke="#55708e" stroke-width="2"/><rect x="1060" y="150" width="280" height="58" rx="12" fill="#efe5dc" stroke="#b47758" stroke-width="2"/></g><text x="180" y="186" text-anchor="middle" class="ink zone">1 · ASK</text><text x="520" y="186" text-anchor="middle" class="ink zone">2 · ORCHESTRATE</text><text x="860" y="186" text-anchor="middle" class="ink zone">3 · PROPOSE</text><text x="1200" y="186" text-anchor="middle" class="ink zone">4 · CHOOSE</text>
<g filter="url(#shadow)"><rect x="40" y="230" width="280" height="100" rx="14" fill="#f8f5f0" stroke="#9d9aa0" stroke-width="2"/><rect x="380" y="230" width="280" height="100" rx="14" fill="#fffdf8" stroke="#c89b3c" stroke-width="2"/><rect x="720" y="230" width="280" height="100" rx="14" fill="#f8f5f0" stroke="#55708e" stroke-width="2"/><rect x="1060" y="230" width="280" height="100" rx="14" fill="#f8f5f0" stroke="#b47758" stroke-width="2"/></g><text x="180" y="266" text-anchor="middle" class="ink label">PERSON</text><text x="180" y="290" text-anchor="middle" class="muted small">“Plan my next 7 days.”</text><text x="520" y="266" text-anchor="middle" class="ink label">AGENT → WEBMCP</text><text x="520" y="290" text-anchor="middle" class="muted small">plan_outfit_week(...)</text><text x="860" y="266" text-anchor="middle" class="ink label">CLOTHO ENGINE</text><text x="860" y="290" text-anchor="middle" class="muted small">three strategies + reasons</text><text x="1200" y="266" text-anchor="middle" class="ink label">PERSON REVIEWS</text><text x="1200" y="290" text-anchor="middle" class="muted small">conflicts · dayparts · tradeoffs</text>
<g filter="url(#shadow)"><rect x="1060" y="440" width="280" height="100" rx="14" fill="#7a1f3d"/><rect x="720" y="440" width="280" height="100" rx="14" fill="#efe5dc" stroke="#b47758" stroke-width="2"/><rect x="380" y="440" width="280" height="100" rx="14" fill="#fff8df" stroke="#c89b3c" stroke-width="2"/></g><text x="1200" y="476" text-anchor="middle" fill="#fff" class="label">EXPLICIT WRITE</text><text x="1200" y="500" text-anchor="middle" fill="#f7dce2" class="small">apply_week_plan(optionId)</text><text x="860" y="476" text-anchor="middle" class="ink label">CALENDAR + HISTORY</text><text x="860" y="500" text-anchor="middle" class="muted small">localStorage changes visibly</text><text x="520" y="476" text-anchor="middle" class="ink label">KEEP EDITING</text><text x="520" y="500" text-anchor="middle" class="muted small">schedule · remove · recolor · wear</text>
<path d="M320 280H380" class="dash arrow" stroke="#7a1f3d"/><path d="M660 280H720" class="dash arrow" stroke="#c89b3c"/><path d="M1000 280H1060" class="dash arrow" stroke="#55708e"/><path d="M1200 330V440" class="dash arrow" stroke="#7a1f3d"/><path d="M1060 490H1000" class="dash arrow" stroke="#b47758"/><path d="M720 490H660" class="dash arrow" stroke="#b47758"/><path d="M520 440V330" class="dash arrow" stroke="#c89b3c"/><text x="350" y="268" text-anchor="middle" class="muted small">prompt</text><text x="690" y="268" text-anchor="middle" class="muted small">tool result</text><text x="1030" y="268" text-anchor="middle" class="muted small">options + reasons</text><text x="1235" y="390" class="muted small">approval</text><text x="1030" y="478" text-anchor="middle" class="muted small">persist</text><text x="690" y="478" text-anchor="middle" class="muted small">continue</text>
<rect x="40" y="650" width="1300" height="66" rx="16" fill="#fff8df" stroke="#c89b3c" stroke-width="2"/><text x="690" y="678" text-anchor="middle" class="ink label">PROPOSAL TOOLS CAN RETURN OPTIONS. WRITE TOOLS CHANGE STATE ONLY AFTER A VISIBLE PRODUCT ACTION.</text><text x="690" y="700" text-anchor="middle" class="muted small">That boundary is the product: agent speed without silent takeover.</text><path d="M40 790H1560" stroke="#eaded9"/><text x="800" y="830" text-anchor="middle" class="ink label">14 REAL WEBMCP TOOLS · ONE REVIEWABLE LOOP</text><text x="800" y="856" text-anchor="middle" class="muted small">search · suggest · batch · plan · apply · schedule · wear · import · recolor · export</text>
</svg>
