<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CLOTHO live production architecture</title><desc id="desc">A real infrastructure map showing the browser, managed chatgpt.site hosting, local browser state, Open-Meteo and optional TmpFiles.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f4ece8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#171715" flood-opacity=".12"/></filter><style>
.ink{fill:#171715;font-family:Verdana}.muted{fill:#6d6870;font-family:Verdana}.head{font-size:28px;font-weight:800;letter-spacing:.8px}.zone{font-size:15px;font-weight:800;letter-spacing:1.5px}.label{font-size:17px;font-weight:800}.small{font-size:13px}.dash{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 10;animation:march 1.15s linear infinite}.solid{fill:none;stroke-linecap:round;stroke-width:3}.arrow{marker-end:url(#arrow)}@keyframes march{to{stroke-dashoffset:-48}}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7a1f3d"/></marker><marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#55708e"/></marker></defs>
<rect width="1600" height="900" rx="28" fill="url(#bg)"/><path d="M40 108H1560" stroke="#eaded9"/><g transform="translate(48 28)"><path d="M22 0C-2 14-8 41 6 63c13 20 37 28 60 20 20-7 30-24 26-40-4-15-18-23-31-16-11 6-16 18-10 28 6 10 17 13 26 8" fill="none" stroke="#7a1f3d" stroke-width="7" stroke-linecap="round"/><path d="M25 17c15 8 25 20 29 37" fill="none" stroke="#c89b3c" stroke-width="4" stroke-linecap="round"/></g><text x="135" y="60" class="ink head">CLOTHO / LIVE PRODUCTION PATH</text><text x="137" y="88" class="muted small">Browser WebMCP → managed site → local-first wardrobe state</text><rect x="930" y="30" width="620" height="54" rx="14" fill="#fff8df" stroke="#c89b3c" stroke-width="2"/><text x="1240" y="53" text-anchor="middle" class="ink small" font-weight="800">REAL INFRASTRUCTURE · NO APP-OWNED DB · NO AUTH</text><text x="1240" y="71" text-anchor="middle" class="muted small">No server-side wardrobe or silent write path</text>
<rect x="40" y="132" width="310" height="610" rx="20" fill="#f8f5f0" stroke="#9d9aa0" stroke-width="2"/><text x="62" y="166" class="ink zone">1 · PERSON + AGENT SURFACE</text><rect x="75" y="205" width="240" height="90" rx="14" fill="#f1dfe3" stroke="#7a1f3d" stroke-width="2" filter="url(#shadow)"/><text x="195" y="240" text-anchor="middle" class="ink label">PERSON</text><text x="195" y="264" text-anchor="middle" class="muted small">taste · approval · correction</text><rect x="75" y="365" width="240" height="90" rx="14" fill="#e8edf5" stroke="#55708e" stroke-width="2" filter="url(#shadow)"/><text x="195" y="400" text-anchor="middle" class="ink label">BROWSER AGENT</text><text x="195" y="424" text-anchor="middle" class="muted small">ChatGPT in-app browser / Chrome</text><rect x="75" y="525" width="240" height="90" rx="14" fill="#efe5dc" stroke="#b47758" stroke-width="2" filter="url(#shadow)"/><text x="195" y="560" text-anchor="middle" class="ink label">VISIBLE REVIEW</text><text x="195" y="584" text-anchor="middle" class="muted small">propose → inspect → approve</text>
<rect x="390" y="132" width="710" height="610" rx="20" fill="#f6f0ed" stroke="#7a1f3d" stroke-width="2"/><text x="414" y="166" class="ink zone" fill="#7a1f3d">2 · MANAGED CHATGPT SITE HOSTING</text><rect x="440" y="205" width="610" height="90" rx="14" fill="#7a1f3d" filter="url(#shadow)"/><text x="745" y="240" text-anchor="middle" fill="#fff" class="label">CLOTHO WEB APP</text><text x="745" y="264" text-anchor="middle" fill="#f7dce2" class="small">React 19 · Vinext/Vite · static site</text><rect x="440" y="365" width="290" height="95" rx="14" fill="#f1dfe3" stroke="#972d3f" stroke-width="2"/><text x="585" y="401" text-anchor="middle" class="ink label">DETERMINISTIC ENGINE</text><text x="585" y="425" text-anchor="middle" class="muted small">catalog · constraints · scores</text><rect x="760" y="365" width="290" height="95" rx="14" fill="#fff8df" stroke="#c89b3c" stroke-width="2"/><text x="905" y="401" text-anchor="middle" class="ink label">WEBMCP SURFACE</text><text x="905" y="425" text-anchor="middle" class="muted small">14 registered browser tools</text><path d="M440 572h610" stroke="#b47758" stroke-width="2"/><path d="M440 572c0-18 18-32 40-32h530c22 0 40 14 40 32v52c0 18-18 32-40 32H480c-22 0-40-14-40-32z" fill="#efe5dc" stroke="#b47758" stroke-width="2"/><text x="745" y="594" text-anchor="middle" class="ink label">BROWSER-LOCAL STATE</text><text x="745" y="618" text-anchor="middle" class="muted small">localStorage · canvas · imported/recolored variants</text>
<rect x="1140" y="132" width="410" height="610" rx="20" fill="#fffdf8" stroke="#9d9aa0" stroke-width="2"/><text x="1164" y="166" class="ink zone">3 · EXTERNAL PROVIDERS</text><rect x="1185" y="227" width="320" height="90" rx="14" fill="#e8edf5" stroke="#55708e" stroke-width="2" filter="url(#shadow)"/><text x="1345" y="263" text-anchor="middle" class="ink label">OPEN-METEO</text><text x="1345" y="287" text-anchor="middle" class="muted small">NYC forecast · cached 6 hours</text><rect x="1185" y="407" width="320" height="90" rx="14" fill="#fff8df" stroke="#c89b3c" stroke-width="2" filter="url(#shadow)"/><text x="1345" y="443" text-anchor="middle" class="ink label">TMPFILES (OPTIONAL)</text><text x="1345" y="467" text-anchor="middle" class="muted small">public temporary HTTPS 2×2 grid</text><rect x="1185" y="587" width="320" height="90" rx="14" fill="#f8f5f0" stroke="#9d9aa0" stroke-width="2"/><text x="1345" y="623" text-anchor="middle" class="ink label">SAME-ORIGIN ROUTES</text><text x="1345" y="647" text-anchor="middle" class="muted small">static SVG export · image bridge</text>
<path d="M195 295V365" class="solid arrow" stroke="#7a1f3d"/><path d="M315 410H440" class="dash arrow" stroke="#7a1f3d"/><text x="372" y="399" text-anchor="middle" class="muted small">tool calls</text><path d="M760 412H730" class="solid arrow" stroke="#972d3f"/><text x="745" y="348" text-anchor="middle" class="muted small">visible result</text><path d="M585 460V540" class="dash arrow" stroke="#b47758"/><text x="615" y="510" class="muted small">read / write</text><path d="M1050 412H1185" class="dash arrow" stroke="#55708e"/><text x="1118" y="401" text-anchor="middle" class="muted small">forecast</text><path d="M1345 497V587" class="dash arrow" stroke="#c89b3c"/><text x="1385" y="548" class="muted small">optional grid</text><path d="M1185 632H1050" class="dash arrow" stroke="#9d9aa0"/><text x="1117" y="620" text-anchor="middle" class="muted small">catalog export</text><path d="M40 790H1560" stroke="#eaded9"/><text x="800" y="830" text-anchor="middle" class="ink label">PRODUCT LOOP</text><text x="800" y="856" text-anchor="middle" class="muted small">The agent coordinates the steps. The person decides what becomes durable.</text>
</svg>
